# Secretary bot — SERVER compose (foreign VPS, no VPN needed).
#
# Deployed to ~/secretary on the box by the GitHub Actions deploy job:
#   ~/secretary/docker-compose.yml   (written from the repo, base64)
#   ~/secretary/.env                 (secrets: BOT_TOKEN, ANTHROPIC_API_KEY, ADMIN_TELEGRAM_ID,
#                                      optional OPENAI_API_KEY for voice transcription)
#   ~/secretary/data/                (SQLite lives here)
#
# The VPS is outside RU, so the bot reaches Telegram and Anthropic directly —
# no VPN sidecar needed.

services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/shvedoff1/secretary:latest}
    container_name: secretary-bot
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data

  # OPTIONAL backup speech-to-text: a local Whisper (faster-whisper, CPU) behind
  # an OpenAI-compatible /v1/audio/transcriptions API. Starts only with the
  # `whisper` profile (the deploy sets COMPOSE_PROFILES=whisper when the GitHub
  # Variable ENABLE_LOCAL_WHISPER=true) and is used only when OpenAI fails —
  # `small` needs ~1-1.5 GB RAM and a few seconds per short voice note on CPU.
  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    container_name: secretary-whisper
    profiles: [whisper]
    restart: unless-stopped
    volumes:
      - whisper-cache:/home/ubuntu/.cache/huggingface/hub

volumes:
  whisper-cache:
